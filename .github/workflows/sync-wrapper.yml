name: Sync wrapper
on:
  push:
    paths:
      - '.github/workflows/sync-wrapper.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Gradle 9.6 wrapper
        run: |
          curl -L --fail https://raw.githubusercontent.com/gradle/gradle/v9.6.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          test "$(git hash-object gradle/wrapper/gradle-wrapper.jar)" = "b1b8ef56b44f16b14dc800fa8103a6d89abb526f"
      - name: Commit wrapper and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/wrapper/gradle-wrapper.jar
          git rm .github/workflows/sync-wrapper.yml
          git commit -m "Sync exact Gradle wrapper binary"
          git push
